trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'azure-free-conn'

stages:
  - stage: Network_Deploy
    displayName: 'Deploy Only Network'
    jobs:
      - job: Terraform_Apply
        steps:
          # 1. எரர் தராத எளிய முறையில் டெராஃபார்ம் இன்ஸ்டால் செய்கிறோம்
          - script: |
              sudo snap install terraform --classic
              terraform --version
            displayName: 'Install Terraform via Snap'

          # 2. Azure CLI டாஸ்க் மூலம் டெராஃபார்ம் ரன் செய்கிறோம்
          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                terraform init
                terraform apply -auto-approve
