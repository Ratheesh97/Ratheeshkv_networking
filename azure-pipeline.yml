trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'azure-free-conn'

stages:
  - stage: Network_Deploy
    displayName: 'Deploy Only Network'
    jobs:
      - job: Terraform_Apply
        steps:
          # 1. எக்ஸ்டென்ஷன் இல்லாமல் நேரடியாக டெராஃபார்ம் ரன் செய்யும் எளிய வழி
          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply via Azure CLI Task'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                terraform init
                terraform apply -auto-approve
